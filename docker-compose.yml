networks:
  outline-network:
    external: true
    name: outline_outline-network

services:
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    container_name: outline
    user: "700:700"
    #command for v1.2.0 as outline stopped using yarn
    command: node build/server/index.js
    #env_file: ./stack.env
    environment:
      NODE_ENV: ${NODE_ENV}
      URL: ${URL}
      TRUST_PROXY: ${TRUST_PROXY}
      PORT: ${PORT}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY}
      SECRET_KEY: ${SECRET_KEY}
      UTILS_SECRET: ${UTILS_SECRET}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE}
      PGSSLMODE: ${PGSSLMODE}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_CONNECTION_POOL_MIN: ${DATABASE_CONNECTION_POOL_MIN}
      DATABASE_CONNECTION_POOL_MAX: ${DATABASE_CONNECTION_POOL_MAX}
      REDIS_URL: ${REDIS_URL}
      FILE_STORAGE: ${FILE_STORAGE}
      FILE_STORAGE_LOCAL_ROOT_DIR: ${FILE_STORAGE_LOCAL_ROOT_DIR}
      FILE_STORAGE_UPLOAD_MAX_SIZE: ${FILE_STORAGE_UPLOAD_MAX_SIZE}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      SMTP_SERVICE: ${SMTP_SERVICE}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED}
      RATE_LIMITER_REQUESTS: ${RATE_LIMITER_REQUESTS}
      RATE_LIMITER_DURATION_WINDOW: ${RATE_LIMITER_DURATION_WINDOW}
      ENABLE_UPDATES: ${ENABLE_UPDATES}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
    restart: always
    #ports:
    #  - "3000:3000"
    volumes:
      - /volume1/Docker/Outline/data:/var/lib/outline/data
    depends_on:
      - outline-redis
    networks:
      outline-network:
        ipv4_address: 192.168.53.10

  outline-redis:
    image: redis
    container_name: outline-redis
    #env_file: ./stack.env
    restart: always
    expose:
      - "6379"
    volumes:
      - /volume1/Docker/Outline/redis/redis.conf:/redis.conf
    command: ["redis-server", "/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 3
    networks:
      outline-network:
        ipv4_address: 192.168.53.12

  outline-web:
    image: nginx
    container_name: outline-web
    ports:
    #  - '580:80'
      - '5443:5443'
    links:
      - outline
    restart: always
    volumes:
      - /volume1/Docker/Outline/web/nginx.conf:/etc/nginx/nginx.conf:ro
      - /volume1/Docker/Outline/cert/tls.crt:/etc/nginx/ssl/tls.crt:ro
      - /volume1/Docker/Outline/cert/tls.key:/etc/nginx/ssl/tls.key:ro
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 20s
      retries: 3
    #environment:
      # NGINX_HOST: mvserver01.home.truxtons.com:5443
      # NGINX_PORT: 80
      # NGINX_PORT_SSL: 443
    networks:
      outline-network:
        ipv4_address: 192.168.53.13
